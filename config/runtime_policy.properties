scheduler.default_model=gpt-5.4
scheduler.default_fallback_models=
scheduler.build_verify.default_model=gpt-5.4
scheduler.build_verify.default_fallback_models=
scheduler.controller.default_model=gpt-5.4
scheduler.controller.default_fallback_models=
scheduler.decompose.runtime_model=gpt-5.4
scheduler.decompose.runtime_fallback_models=
scheduler.decompose.builder_model=gpt-5.4
scheduler.decompose.builder_fallback_models=
scheduler.decompose.verifier_model=gpt-5.4
scheduler.decompose.verifier_fallback_models=
scheduler.child_implementation.default_model=gpt-5.4
scheduler.child_implementation.default_fallback_models=
scheduler.v2.owner_mode=v2_primary
scheduler.v2.parent_uid=PIS-20260503-141736Z-88E7
scheduler.backend=v2
scheduler.watchdog.backend=v2
scheduler.global_concurrency_cap=1
scheduler.role_concurrency_caps=builder:1,assurer:1,verifier:1,generalist:1,orchestrator:1
scheduler.resource_class_caps=

mobile.chat_turn_timeout_s=3600
mobile.chat_idle_timeout_s=600
mobile.workflow_timeout_s=1800
mobile.direct_host_verification_timeout_s=600
mobile.chat_model=gpt-5.4
mobile.chat_reasoning_effort=medium
mobile.chat_fallback_models=gpt-5.4-mini,gpt-5.2-codex,gpt-5.2,gpt-5.1-codex-max,gpt-5.1-codex-mini

agents.codex_turn_timeout_s=7000
agents.codex_max_workers=240
agents.codex_max_workers_per_role=80
agents.orchestrator_turn_timeout_s=1800
agents.workflow.max_infra_retries=2
agents.workflow.generalist_slice_timeout_s=180
agents.workflow.builder_slice_timeout_s=300
agents.workflow.verifier_slice_timeout_s=300
agents.workflow.generalist_progress_timeout_s=75
agents.workflow.builder_progress_timeout_s=120
agents.workflow.verifier_progress_timeout_s=120
agents.workflow.role_output_grace_s=30
agents.workflow.failure_retry_bound=2
agents.workflow.activity_repeat_bound=2
agents.workflow.stuck_retry_limit=2
agents.workflow.control_mode=deterministic
agents.benchmark.contender_timeout_s=3900
agents.benchmark.planning_progress_timeout_s=180
agents.benchmark.runtime_deadline_grace_s=10
agents.swarm.wall_clock_s=3600
agents.swarm.maker_lease_s=300
agents.swarm.finisher_lease_s=180
agents.swarm.max_makers=4
agents.swarm.max_finishers=2

host_verification.default_timeout_s=3600

# Assistant access bridge trial surface (T8M3).
assistant.api_enabled=true
assistant.token_file=runtime/secrets/assistant_bridge_tokens.json
assistant.read_only_mode=true
assistant.default_execution_mode=isolated
assistant.allow_live_mode=false
assistant.session_ttl_sec=3600
assistant.max_sessions=3
assistant.max_diff_bytes=262144
assistant.max_stdout_bytes=16384
assistant.max_stderr_bytes=16384
assistant.max_artifact_read_bytes=65536
assistant.control_pane_session_ttl_sec=1800

# Assistant ingress probe transport contract (A1Q4).
assistant.probe.enabled=true
assistant.probe.auth_mode=localhost_or_secret
assistant.probe.secret=
assistant.probe.max_body_bytes=65536
assistant.probe.max_echo_bytes=4096
assistant.probe.max_delay_ms=2500
assistant.probe.allowed_ingress_tags=direct_https,cloudflare_tunnel,ngrok,custom_port_test,unspecified
