supplemental:
  extracted_from_bundle:
    source_file: many_files_to_split.yaml
    asset_name: state_transition_patterns.yaml
    payload:
      patterns:
        - id: pending_to_running
          trigger: claim_task
          invariants:
            - at_most_one_active_execution
        - id: running_to_success
          trigger: complete_task
          invariants:
            - persisted_state_reflects_committed_ownership
        - id: running_to_failed
          trigger: handle_error
          invariants:
            - recovery_actions_must_be_idempotent
        - id: failed_to_pending
          trigger: retry_logic
          invariants:
            - exponential_backoff_on_retry
        - id: any_to_cancelled
          trigger: operator_cancel
          invariants:
            - idempotent_cleanup_on_cancel
        - id: pending_to_expired
          trigger: timeout_guard
          invariants:
            - all_resource_allocations_have_timeouts
        - id: running_to_stale
          trigger: heartbeat_failure
          invariants:
            - worker_claims_must_be_heartbeated
        - id: stale_to_pending
          trigger: reclaim_logic
          invariants:
            - no_orphaned_claims
        - id: expired_to_deleted
          trigger: cleanup_task
          invariants:
            - idempotent_cleanup_operations
        - id: created_to_pending
          trigger: schedule_launch
          invariants:
            - pre_launch_validation
        - id: running_to_retrying
          trigger: transient_failure
          invariants:
            - retries_do_not_duplicate_external_side_effects
        - id: retrying_to_failed
          trigger: max_retries_reached
          invariants:
            - max_retry_limit_enforced
        - id: any_to_error
          trigger: system_panic
          invariants:
            - fail_closed_on_auth_service_error
        - id: active_to_paused
          trigger: operator_pause
          invariants:
            - operator_override_actions_emit_audit_evidence
        - id: paused_to_active
          trigger: operator_resume
          invariants:
            - operator_override_actions_emit_audit_evidence
        - id: draft_to_created
          trigger: validate_config
          invariants:
            - input_sanitization_at_ingress_boundary
        - id: running_to_waiting
          trigger: external_dependency_wait
          invariants:
            - observability_spans_must_cover_entire_pipeline
        - id: waiting_to_running
