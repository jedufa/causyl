  - tbz2
  - txz
  - cab
  - iso
  - dmg
  named_rules:
    docs:
    - docs/
    - '*.md'
    - '*.rst'
    - '*.txt'
    reports:
    - reports/
    - docs/reports/
    - '*report*'
    - '*summary*'
    runtime:
    - runtime/
    - '*.log'
    - '*.trace'
    - '*.dump'
    generated_artifacts:
    - generated/
    - rendered/
    - exports/
    - '*.generated'
    - '*.autogen'
    temporary_outputs:
    - tmp/
    - temp/
    - out/
    - '*.tmp'
    - '*.cache'
    snapshots:
    - snapshots/
    - '*.snapshot'
    - '*.snap'
    build_outputs:
    - dist/
    - build/
    - coverage/
    vendor:
    - vendor/
    - third_party/
    - node_modules/
supplemental:
  application_policy:
    authoritative_exclude_categories:
    - path_prefixes
    - directory_names
    - extensions
    - binary_extensions
    - media_extensions
    - archive_extensions
    - exact_filenames
    require_corroborating_evidence_categories:
    - generated_markers
    - report_markers
    - runtime_markers
    - temp_markers
    - build_markers
    - vendor_markers
    - cache_markers
    - snapshot_markers
    - export_markers
    - suffixes
    - basenames
    do_not_exclude_when:
    - same_file_has_authoritative_mutation_signal
    - same_file_has_validation_before_mutation_signal
    - same_file_has_ownership_guard_signal
    - same_file_has_primary_subsystem_match
    preference: under_filter_when_evidence_is_mixed
