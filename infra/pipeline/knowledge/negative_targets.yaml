version: 1
phase: 0
notes: Repo-agnostic negative target rules for excluding non-authoritative, generated, or downstream-only artifacts from retrieval and planning. Broad single-word triggers are avoided; most marker categories require corroborating path or content evidence before suppression.
rules:
  path_prefixes:
  - runtime/
  - reports/
  - tmp/
  - temp/
  - cache/
  - dist/
  - build/
  - out/
  - coverage/
  - artifacts/
  - snapshots/
  - rendered/
  - exports/
  - generated/
  - vendor/
  - third_party/
  - node_modules/
  - .venv/
  - .mypy_cache/
  - .pytest_cache/
  - __pycache__/
  - .nox/
  - .tox/
  - .ruff_cache/
  - .terraform/
  - .next/
  file_patterns:
  - '*.generated.py'
  - '*.pb.go'
  - '*.g.dart'
  - '*.gen.ts'
  - '*.designer.cs'
  - '*.min.js'
  - '*.min.css'
  - '*.pyc'
  - '*.pyo'
  - '*.class'
  - '*.o'
  - '*.so'
  - '*.dll'
  - '*.dylib'
  - '*.jar'
  - '*.trace'
  - '*.coverage'
  - '*.snap'
  - '*.cache'
  - '*.dump'
  - '*.prof'
  - '*.heap'
  - '*.core'
  - '*.orig'
  - '*.rej'
  directory_names:
  - runtime
  - reports
  - tmp
  - temp
  - cache
  - dist
  - build
  - out
  - coverage
  - artifacts
  - snapshots
  - rendered
  - exports
  - generated
  - vendor
  - third_party
  - node_modules
  - __pycache__
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .tox
  - .nox
  - .terraform
  - .next
  - .venv
  exact_filenames:
  - package-lock.json
  - poetry.lock
  - yarn.lock
  - pnpm-lock.yaml
  - Cargo.lock
  - coverage.xml
  - lcov.info
  - pytestdebug.log
  - nohup.out
  - .DS_Store
  - Thumbs.db
  - tsconfig.tsbuildinfo
  - pip-wheel-metadata
  - CMakeCache.txt
  - compile_commands.json
  - generated_index.ts
  - swagger_client.py
  - openapi_client.py
  - schema.pb.go
  - snapshot_manifest.json
  suffixes:
  - _generated
  - _autogen
  - _snapshot
  - _golden
  - _fixture_render
  - _coverage
  - _benchmark_report
  - _incident_report
  - _health_report
  - _timing_report
  - _latency_report
  - _export
  - _bundle_output
  - _compiled_asset
  - _vendor_copy
  - _cache_dump
  - _runtime_dump
  - _diagnostic_dump
  - _artifact_pack
  - _rendered_view
  - _minified
  - _build_output
  basenames:
  - generated_client
  - generated_schema
  - snapshot_fixture
  - reference_output
  - golden_output
  - coverage_report
  - benchmark_report
  - incident_report
  - health_report
  - timing_report
  - latency_report
  - artifact_export
  - metrics_export
  - state_export
  - trace_export
  - runtime_dump
  - cache_dump
  - vendor_bundle
  - build_manifest
  - rendered_report
  - compiled_asset
  - export_bundle
  extensions:
  - pyc
  - pyo
  - class
  - o
  - so
  - dll
  - dylib
  - jar
  - wasm
  - ico
  - png
  - jpg
  - jpeg
  - gif
  - svg
  - pdf
  - csv
  - parquet
  - log
  - trace
  - coverage
  - snap
  - cache
  - dump
  - prof
  hidden_paths:
