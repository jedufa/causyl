  - .github/workflows/
  - .gitlab/
  - .svn/
  - .hg/
  - .cache/
  - .pytest_cache/
  - .mypy_cache/
  - .ruff_cache/
  - .tox/
  - .nox/
  - .idea/
  - .vscode/
  - .terraform/
  - .next/
  - .nuxt/
  - .parcel-cache/
  - .sass-cache/
  - .serverless/
