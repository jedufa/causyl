version: 1
phase: 0
notes: "Structured patch contract templates for deterministic planning and later machine use."
templates:
  default:
    invariants:
      - "state-changing paths must validate current ownership and lifecycle truth"
      - "duplicate side effects must be prevented across retry, replay, and restart"
      - "durable evidence must exist for every externally visible mutation"
    validation_rules:
      - "reject stale version or stale generation writes"
      - "reject illegal state transitions"
      - "reject missing required identifiers or correlation keys"
    retry_policy:
      - "retry only transient failures"
      - "persist attempt counters before relaunch"
      - "stop retry when terminal validation failure is detected"
    operator_safety:
      - "manual overrides require actor and reason evidence"
      - "force actions must preserve invariant checks"
      - "destructive controls must reconcile active ownership first"
    observability_guarantees:
      - "emit durable receipts for accepted and rejected operations"
      - "preserve lineage and correlation identifiers"
      - "record source state and destination state for protected transitions"
    consistency_guarantees:
      - "committed state must remain reconstructable"
      - "late events must not overwrite newer truth"
      - "recovery must converge to a safe stable state"
    must_not_change:
      - "public identifiers used for lineage and ownership"
      - "existing terminal-state semantics"
      - "durable receipt schema relied on by recovery"
    test_implications:
      - "add idempotency coverage"
      - "add stale-state rejection coverage"
      - "add crash-recovery or replay coverage"
