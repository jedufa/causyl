supplemental:
  extracted_from_bundle:
    source_file: many_files_to_split.yaml
    asset_name: patch_contract_templates.yaml
    payload:
      sections:
        - id: invariants
          required: true
          description: "List of system invariants that must be maintained."
        - id: failure_mappings
          required: true
          description: "Mapping of specific failure modes to their mitigation logic."
        - id: validation_rules
          required: true
          description: "New or modified validation logic to be implemented."
        - id: retry_policy
          required: true
          description: "Backoff and retry behavior for the modified code."
        - id: operator_safety
          required: true
          description: "Safety checks for manual or triggered operations."
        - id: observability_guarantees
          required: false
          description: "Logs and metrics that must be emitted by the patch."
        - id: consistency_guarantees
          required: true
          description: "Guarantees regarding data and state consistency."
        - id: must_not_change
          required: true
          description: "Specific behaviors or code sections that are frozen."
        - id: test_implications
          required: true
          description: "Required test updates or new test cases."
        - id: unresolved_uncertainties
          required: false
          description: "Potential risks that need manual review."
        - id: audit_requirements
          required: true
          description: "Specific audit logging required for this patch."
        - id: idempotency_keys
          required: false
          description: "Names and sources for required idempotency keys."
        - id: state_transition_map
          required: false
          description: "Formal map of allowed state changes."
        - id: dependency_impact
          required: false
          description: "Effects on downstream systems."
        - id: performance_bounds
          required: false
          description: "Latencey or throughput requirements."
        - id: concurrency_model
          required: true
          description: "Locks or patterns used for thread safety."
        - id: rollback_strategy
          required: true
          description: "How to revert these changes safely."
        - id: side_effect_inventory
          required: true
          description: "List of all external calls made."
        - id: ownership_handover
          required: false
          description: "How resource claims are passed."
        - id: fail_closed_logic
          required: true
          description: "Behavior when critical dependencies fail."
