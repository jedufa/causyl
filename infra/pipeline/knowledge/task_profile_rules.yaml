supplemental:
  extracted_from_bundle:
    source_file: many_files_to_split.yaml
    asset_name: task_profile_rules.yaml
    payload:
      rules:
      - id: high_risk_state_mutation
        condition: concerns include mutation_boundary
        bias: increase retrieval of persistence layer
      - id: external_side_effect_risk
        condition: triggers include ['send', 'api', 'notify']
        bias: require idempotency_keys section in patch contract
      - id: concurrency_critical
        condition: concerns include concurrency_control
        bias: prioritize files with 'lock', 'atomic', or 'mutex' symbols
      - id: manual_operator_path
        condition: task_family == operator_action_add
        bias: require operator_safety validation in bundle
      - id: recovery_logic_sensitive
        condition: concerns include recovery_integrity
        bias: include rollback_strategy in patch contract
      - id: observability_gap
        condition: concerns include observability AND NOT triggers include ['log',
          'metric']
        bias: flag bundle_gap_warning for missing telemetry
      - id: stale_state_risk
