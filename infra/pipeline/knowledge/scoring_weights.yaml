supplemental:
  calibration_guidance:
    retrieval_weight_range:
    - -0.18
    - 0.2
    coverage_point_range:
    - -12
    - 12
    design_rule: prefer fewer decisive signals over many weak additive hints
    penalty_rule: missing required evidence and conflicting evidence should outweigh cosmetic positive matches
    validation_goal: weights should be rechecked against benchmark traces rather than expanded further
