supplemental:
  application_policy:
    minimum_conditions_to_demote:
    - pattern_match_plus_passive_path_context
    - two_pattern_matches_without_mutation_signal
    - pattern_match_plus_negative_target_context
    do_not_demote_when:
    - file_has_authoritative_mutation_signal
    - file_has_validation_before_mutation_signal
    - file_has_primary_ownership_guard
    - file_has_primary_subsystem_match_and_active_family_alignment
    preference: under-demote when implementation evidence conflicts with passive hints
