[pytest]
testpaths = tests
addopts = -q -ra
markers =
    regression: Historical bug lock or seam-truth guard intended to prevent re-breakage.
    smoke: Small high-signal sanity check for a critical surface.
    e2e: End-to-end or cross-layer behavior test.
    integration: Multi-module or external-seam integration test.
norecursedirs =
    logs
    docs
    experiments
    .projgpt
    .pytest_cache
